[project]
name = "reactive-lob-sim"
version = "0.1.0"
description = "Reactive crypto limit-order-book simulator with calibrated impact coupling and a sim-to-real gap score (Tradeq S3)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Alex Asadullin" }]
dependencies = [
    "fastapi==0.156.8",
    "httpx==0.28.1",
    "numba==0.68.0",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "structlog==26.1.0",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# The generative order-flow model is the only part that needs torch; the matching engine,
# replay, ABM, calibration, realism scoring and the sim-service run without it.
gen = ["torch==2.14.1"]

[project.scripts]
sim = "reactive_lob_sim.cli:app"

[dependency-groups]
dev = [
    "hypothesis==6.170.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reactive_lob_sim"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "W", "C4", "PT", "RET"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["reactive_lob_sim"]
plugins = ["pydantic.mypy"]

# Third-party packages without type information. Their call sites are wrapped in typed helpers.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "numba", "numba.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: tests that need network or live services (skipped by default)",
    "slow: longer end-to-end tests",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["reactive_lob_sim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
